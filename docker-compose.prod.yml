services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sessoes_julgamento
      POSTGRES_USER: sessoes_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD obrigatoria}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessoes_user -d sessoes_julgamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: sessoes-julgamento:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/sessoes_julgamento
      DATABASE_USERNAME: sessoes_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD obrigatoria}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatoria}
      UPLOAD_DIR: /app/uploads
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  uploads-data: