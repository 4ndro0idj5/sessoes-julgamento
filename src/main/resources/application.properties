spring.config.import=optional:file:.env[.properties]

spring.application.name=sessoes-julgamento
server.port=8080

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=80MB

sessoes.upload-dir=${UPLOAD_DIR}
sessoes.jwt.secret=${JWT_SECRET}
sessoes.jwt.expiration-ms=3600000

spring.web.resources.static-locations=classpath:/static/

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existente antes do Flyway
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
