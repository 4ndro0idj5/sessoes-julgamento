<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Gestor</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">
            ⚖️
        </div>

        <h1>Área do Gestor</h1>

        <p>
            Faça login para gerenciar as sessões de julgamento.
        </p>

        <form id="loginForm">

            <label for="usuario">
                Usuário
            </label>

            <input
                    type="text"
                    id="usuario"
                    placeholder="Informe seu usuário"
                    required>

            <label for="senha">
                Senha
            </label>

            <input
                    type="password"
                    id="senha"
                    placeholder="Informe sua senha"
                    required>

            <button type="submit">
                Entrar
            </button>

        </form>

        <a href="index.html" class="voltar">
            ← Voltar
        </a>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
