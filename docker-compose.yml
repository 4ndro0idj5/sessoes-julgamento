services:
  postgres:
    image: postgres:16-alpine
    container_name: sessoes-postgres
    environment:
      POSTGRES_DB: sessoes_julgamento
      POSTGRES_USER: sessoes_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sessoes_user -d sessoes_julgamento]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
